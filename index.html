<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Astral — Checklist</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <span class="topbar-icon">⭐</span>
    <h1>Anime Astral <span>Checklist</span></h1>
  </div>

  <div class="global-progress">
    <div class="global-progress-labels">
      <span id="globalPercentLabel" class="mono">0%</span>
      <span class="global-progress-sub mono" id="globalCountLabel">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="globalProgressFill"></div>
    </div>
  </div>

  <div class="topbar-actions">
    <div id="authArea" class="auth-area"></div>
    <input type="text" id="searchInput" placeholder="Search..." class="search-input">
    <button id="resetBtn" class="btn btn-danger" title="Reset all progress">Reset</button>
  </div>
</header>

<main id="worldsContainer"></main>

<footer class="footer">
  <p>Progress is saved automatically in this browser.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="data.js?v=1"></script>
<script src="script.js?v=1"></script>
<script src="firebase-config.js?v=1"></script>
<script src="firebase-sync.js?v=1"></script>
</body>
</html>
