<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Astral - Checklist</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <span class="topbar-icon">⭐</span>
    <h1>Anime Astral <span>Checklist</span></h1>
  </div>

  <div class="global-progress">
    <div class="global-progress-labels">
      <span id="globalPercentLabel" class="mono">0%</span>
      <span class="global-progress-sub mono" id="globalCountLabel">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="globalProgressFill"></div>
    </div>
  </div>
</header>

<div class="app-layout">
  <nav class="sidebar">
    <input type="text" id="searchInput" placeholder="Search..." class="search-input sidebar-search">
    <div id="pageNav" class="page-nav"></div>
    <div class="sidebar-footer">
      <div id="authArea" class="auth-area"></div>
      <div class="footer-divider">or</div>
      <div class="backup-row">
        <button id="copyCodeBtn" class="btn" title="No Google account? Copy a backup code to save your progress">Copy Code</button>
        <button id="restoreCodeBtn" class="btn" title="Restore your progress from a backup code">Restore Code</button>
      </div>
      <button id="resetBtn" class="btn btn-danger" title="Reset all progress">Reset</button>
    </div>
  </nav>

  <main id="pageContent"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="data.js?v=6"></script>
<script src="script.js?v=5"></script>
<script src="firebase-config.js?v=1"></script>
<script src="firebase-sync.js?v=4"></script>
</body>
</html>
