<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="bariltomas">
<title>Anime Astral - Checklist</title>
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="topbar-brand">
      <span class="topbar-mark">⭐</span>
      <h1>Anime Astral <span>Checklist</span></h1>
    </div>

    <div class="topbar-stats">
      <span id="globalPercentLabel" class="topbar-percent mono">0%</span>
      <span class="topbar-count mono" id="globalCountLabel">0 / 0</span>
      <button id="disclaimerBtn" class="disclaimer-btn" title="Data accuracy notice">!</button>
    </div>
  </div>

  <div class="topbar-bar">
    <div class="topbar-bar-fill" id="globalProgressFill"></div>
  </div>
</header>

<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-search-wrap">
      <input type="text" id="searchInput" placeholder="Search everything..." class="search-input sidebar-search" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>
    <div id="pageNav" class="page-nav"></div>
    <div class="sidebar-footer">
      <div id="authArea" class="auth-area"></div>
      <div class="footer-divider">or</div>
      <div class="backup-row">
        <button id="copyCodeBtn" class="btn" title="No Google account? Copy a backup code to save your progress">Copy Code</button>
        <button id="restoreCodeBtn" class="btn" title="Restore your progress from a backup code">Restore Code</button>
      </div>
      <button id="resetBtn" class="btn btn-danger" title="Reset all progress">Reset</button>
      <div id="creditsRow" class="credits-row"></div>
    </div>
  </nav>

  <main id="pageContent"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="data.js?v=60"></script>
<script src="script.js?v=36"></script>
<script src="firebase-config.js?v=1"></script>
<script src="firebase-sync.js?v=5"></script>
</body>
</html>
